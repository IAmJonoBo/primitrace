version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - bandit@1.9.4
    - checkov@3.3.9
    - pinact@4.0.0
    - taplo@0.10.0
    - actionlint@1.7.12
    - git-diff-check
    - markdownlint@0.49.1
    - prettier@3.9.6
    - renovate@44.14.3
    - ruff@0.16.1
    - shellcheck@0.11.0
    - shfmt@3.13.1
    - trufflehog@3.96.0
    - yamllint@1.38.0
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
runtimes:
  enabled:
    - node@22.16.0
    - python@3.13.3
