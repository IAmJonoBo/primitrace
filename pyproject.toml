[project]
name = "primitrace"
version = "0.1.0"
description = "Designer-grade vectorisation of logos and flat graphics by primitive fitting, with measured fidelity."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Jonathan Botha" }]
keywords = ["vectorisation", "svg", "logo", "potrace", "tracing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
  "numpy>=2.2",
  "opencv-python-headless>=4.11",
  "pillow>=11",
  "resvg-py>=0.5.0",
  "scikit-image>=0.25",
  "scikit-learn>=1.6",
  "scipy>=1.15",
  "vtracer>=0.6.15",
]

[project.urls]
Repository = "https://github.com/IAmJonoBo/primitrace"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.13"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/primitrace"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error"
