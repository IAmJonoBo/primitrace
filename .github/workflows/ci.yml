---
name: Fleet verification

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primitrace-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Required verification. primitrace is public, so it runs on GitHub-hosted runners (the fleet's
  # rule for public code); macOS coverage is nightly in macos-compatibility.yml.
  verify:
    name: Required verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        # yamllint disable rule:comments
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # yamllint enable rule:comments
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Confirm the checked-out revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install the tracer and the pinned rasteriser's library
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends potrace librsvg2-bin

      - name: Install the pinned toolchain
        # yamllint disable rule:comments
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        # yamllint enable rule:comments
        with:
          version: 2026.9.15

      - name: Install Trunk
        # yamllint disable rule:comments
        uses: trunk-io/trunk-action/setup@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0
        # yamllint enable rule:comments

      - name: Run changed-file linting (observational)
        continue-on-error: true
        timeout-minutes: 5
        run: bash scripts/trunk-observe.sh

      - name: Run repository-native verification
        run: mise run ci:validate
